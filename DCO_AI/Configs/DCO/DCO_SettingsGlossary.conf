DCO_SettingsGlossaryConfig {
 m_aTerms {
  DCO_SettingTerm {
   m_sId "suppression"
   m_sTerm "Suppression"
   m_sDefinition "The effect of incoming fire that makes soldiers duck, lose accuracy and stop moving."
   m_sAliases "suppressed suppressing suppressive"
  }
  DCO_SettingTerm {
   m_sId "pinned"
   m_sTerm "Pinned"
   m_sDefinition "A soldier under such accurate fire that he stays down and can only fire rare unaimed bursts."
   m_sAliases "pinned down"
  }
  DCO_SettingTerm {
   m_sId "lod"
   m_sTerm "AI LOD"
   m_sDefinition "Level of detail of the AI simulation. Lower detail saves CPU but distant AI may pause or act simpler."
   m_sAliases "LOD"
  }
  DCO_SettingTerm {
   m_sId "cohesion"
   m_sTerm "Cohesion"
   m_sDefinition "How close squad members stay to their leader."
  }
  DCO_SettingTerm {
   m_sId "bounding"
   m_sTerm "Bounding"
   m_sDefinition "Moving in turns: one team covers with fire while the other rushes forward, then they swap."
   m_sAliases "bound bounds"
  }
  DCO_SettingTerm {
   m_sId "overmatch"
   m_sTerm "Overmatch"
   m_sDefinition "Being clearly stronger than the enemy in front of you, counting MGs, AT and vehicles more."
   m_sAliases "outguns"
  }
  DCO_SettingTerm {
   m_sId "contact_sop"
   m_sTerm "Contact SOP"
   m_sDefinition "The standard reaction when a squad sees an enemy before being seen: observe, ambush, bypass, engage or withdraw."
   m_sAliases "SOP"
  }
  DCO_SettingTerm {
   m_sId "break_contact"
   m_sTerm "Break contact"
   m_sDefinition "Pulling back from a fight under cover of smoke and fire, one team at a time."
   m_sAliases "breaks contact"
  }
  DCO_SettingTerm {
   m_sId "cqb"
   m_sTerm "CQB"
   m_sDefinition "Close quarters battle: fighting inside and around buildings."
   m_sAliases "close quarters"
  }
  DCO_SettingTerm {
   m_sId "stack"
   m_sTerm "Stack"
   m_sDefinition "The entry team lined up at a door, ready to go in together."
   m_sAliases "stacks"
  }
  DCO_SettingTerm {
   m_sId "breach"
   m_sTerm "Breach"
   m_sDefinition "Forcing the entry into a room, here by throwing a grenade first."
   m_sAliases "breaches"
  }
  DCO_SettingTerm {
   m_sId "slice_pie"
   m_sTerm "Slice the pie"
   m_sDefinition "Checking a doorway or corner in small steps so only a thin slice of the room is exposed at a time."
   m_sAliases "slicing the pie"
  }
  DCO_SettingTerm {
   m_sId "garrison"
   m_sTerm "Garrison"
   m_sDefinition "A group occupying buildings: windows, roofs, doors and interiors."
   m_sAliases "garrisons"
  }
  DCO_SettingTerm {
   m_sId "leash"
   m_sTerm "Leash"
   m_sDefinition "How far a holding group may move away from its position before it must return."
  }
  DCO_SettingTerm {
   m_sId "relay_hop"
   m_sTerm "Relay hop"
   m_sDefinition "One step of passing a contact on from squad to squad. Each hop adds position error."
   m_sAliases "hop hops"
  }
  DCO_SettingTerm {
   m_sId "rto"
   m_sTerm "RTO"
   m_sDefinition "Radio operator. Carries the radio used for reports and requests."
   m_sAliases "radio operator"
  }
  DCO_SettingTerm {
   m_sId "base_of_fire"
   m_sTerm "Base of fire"
   m_sDefinition "A position, usually around an MG, that keeps the enemy suppressed while others move."
  }
  DCO_SettingTerm {
   m_sId "overwatch"
   m_sTerm "Overwatch"
   m_sDefinition "Watching over another team's movement from a good position, ready to fire."
  }
  DCO_SettingTerm {
   m_sId "fm"
   m_sTerm "F&M"
   m_sDefinition "Fire and Maneuver: one element fixes the enemy with fire while another moves to assault."
   m_sAliases "Fire and Maneuver"
  }
  DCO_SettingTerm {
   m_sId "sbf"
   m_sTerm "SBF"
   m_sDefinition "Support by Fire: a position that fires on the objective to support an assault."
   m_sAliases "Support by Fire"
  }
  DCO_SettingTerm {
   m_sId "culmination"
   m_sTerm "Culmination"
   m_sDefinition "The point where an attack has lost too much strength to continue and must stop or withdraw."
   m_sAliases "culminated"
  }
  DCO_SettingTerm {
   m_sId "reserve"
   m_sTerm "Reserve"
   m_sDefinition "Forces held back, not committed, ready to react or exploit."
   m_sAliases "reserves"
  }
  DCO_SettingTerm {
   m_sId "fog_of_war"
   m_sTerm "Fog of war"
   m_sDefinition "Uncertainty about where the enemy is and how strong it is."
  }
  DCO_SettingTerm {
   m_sId "kill_zone"
   m_sTerm "Kill zone"
   m_sDefinition "The area of an ambush where all fire lands at once."
   m_sAliases "killzone"
  }
  DCO_SettingTerm {
   m_sId "msr"
   m_sTerm "MSR"
   m_sDefinition "Main supply route: a road the enemy uses repeatedly for vehicles."
   m_sAliases "supply route"
  }
  DCO_SettingTerm {
   m_sId "op"
   m_sTerm "OP"
   m_sDefinition "Observation post: a small hidden team watching an area and reporting."
   m_sAliases "observation post observation posts"
  }
  DCO_SettingTerm {
   m_sId "counter_battery"
   m_sTerm "Counter-battery"
   m_sDefinition "Finding and firing back at enemy mortars or artillery."
  }
  DCO_SettingTerm {
   m_sId "feint"
   m_sTerm "Feint"
   m_sDefinition "A fake attack meant to draw the enemy's attention and reserves away from the real one."
   m_sAliases "feints"
  }
  DCO_SettingTerm {
   m_sId "medevac"
   m_sTerm "MEDEVAC"
   m_sDefinition "Medical evacuation of casualties by vehicle."
  }
  DCO_SettingTerm {
   m_sId "sheaf"
   m_sTerm "Sheaf"
   m_sDefinition "The pattern in which artillery rounds land around the aiming point."
  }
  DCO_SettingTerm {
   m_sId "illumination"
   m_sTerm "Illumination"
   m_sDefinition "Flares or illumination rounds that light up an area at night."
   m_sAliases "flare flares"
  }
  DCO_SettingTerm {
   m_sId "danger_close"
   m_sTerm "Danger close"
   m_sDefinition "Friendly fire landing near friendly troops."
  }
  DCO_SettingTerm {
   m_sId "beaten_zone"
   m_sTerm "Beaten zone"
   m_sDefinition "The area where rounds from a weapon or barrage are landing."
  }
  DCO_SettingTerm {
   m_sId "hull_down"
   m_sTerm "Hull-down"
   m_sDefinition "A vehicle positioned so only its turret shows over a crest or cover."
  }
  DCO_SettingTerm {
   m_sId "idle"
   m_sTerm "Idle"
   m_sDefinition "A group with no orders that takes cover and holds where it is."
   m_sAliases "IDLE"
  }
 }
}
