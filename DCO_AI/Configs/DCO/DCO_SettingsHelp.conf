  DCO_SettingSubHelp {
   m_sCategory "AI_GlobalSystem"
   m_sPurpose "Baseline combat skill for every AI soldier: aim, spotting and grenade use."
   m_sInteract "Skill Preset sets the per-skill spread and settle time; Aim Accuracy, Aim Shake, Aim Speed and Perception fine-tune it (1.0 = realistic). Grenade, GL and smoke usage are independent chances."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Fair coop"
     m_sValues "Skill Preset Regular, Aim Accuracy 1.0, Aim Shake 1.0, Aim Speed 1.0, Perception 1.5"
    }
    DCO_SettingSetup {
     m_sName "Hard"
     m_sValues "Skill Preset Veteran, Aim Accuracy 1.3, Aim Shake 1.2, Aim Speed 1.2, Perception 2.0"
    }
    DCO_SettingSetup {
     m_sName "Casual"
     m_sValues "Skill Preset Rookie, Aim Accuracy 1.0, Aim Shake 1.0, Aim Speed 1.0, Perception 1.0"
    }
   }
   m_sPitfalls "High Aim Accuracy combined with high Aim Speed feels like an aimbot. Magic Magazine switches off ammo logistics."
  }
  DCO_SettingSubHelp {
   m_sCategory "CommanderArtillery"
   m_sPurpose "When and how accurately the commander's mortars and artillery fire."
   m_sInteract "Target certainty chooses point fire, area fire or no fire. Cooldowns limit how often missions happen; the friendly safe radius blocks danger-close missions."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Restrained"
     m_sValues "Rejection 0.3, Mission cooldown 120 s"
    }
    DCO_SettingSetup {
     m_sName "Default"
     m_sValues "Rejection 0.1, Mission cooldown 60 s"
    }
    DCO_SettingSetup {
     m_sName "Heavy"
     m_sValues "Rejection 0.05, Mission cooldown 40 s"
    }
   }
   m_sPitfalls "A friendly safe radius near 0 allows rounds on top of friendly troops."
  }
  DCO_SettingSubHelp {
   m_sCategory "CommanderDefense"
   m_sPurpose "How the commander defends and scouts: recon, patrols, ambushes, observation posts, counterattacks, counter-battery and feints."
   m_sInteract "Most options take squads from the reserve, so a larger reserve means more defensive activity."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Passive"
     m_sValues "Recon 1, all defense options Off"
    }
    DCO_SettingSetup {
     m_sName "Default"
     m_sValues "Recon 2, all On"
    }
    DCO_SettingSetup {
     m_sName "Active"
     m_sValues "Recon 3, all On, vehicle patrol radius 3.5"
    }
   }
   m_sPitfalls "Many defense tasks with a small reserve leave nothing for the attack."
  }
  DCO_SettingSubHelp {
   m_sCategory "CommanderLogistics"
   m_sPurpose "Automatic logistics jobs: MEDEVAC, extraction, resupply and escorts, plus reinforcement stock."
   m_sInteract "Jobs need transport teams (small crews with unarmed vehicles). MEDEVAC returns soldiers as new reserve squads."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Full logistics"
     m_sValues "All On"
    }
    DCO_SettingSetup {
     m_sName "No logistics"
     m_sValues "All Off"
    }
   }
   m_sPitfalls "Resupply does nothing while Magic Magazine is on."
  }
  DCO_SettingSubHelp {
   m_sCategory "CommanderObjective"
   m_sPurpose "Name, capture area and current owner of this objective."
   m_sInteract "The radius defines where units count toward control."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Village"
     m_sValues "Radius 60-80 m"
    }
    DCO_SettingSetup {
     m_sName "Crossroads"
     m_sValues "Radius 30 m"
    }
   }
   m_sPitfalls "A huge radius makes captures slow, especially with Capture Waits For Buildings on."
  }
  DCO_SettingSubHelp {
   m_sCategory "CommanderSpawner"
   m_sPurpose "When this spawner creates new groups and which commander receives them."
   m_sInteract "Triggers (start, manpower, objective event, commander request) fire spawns; cooldown, safe radius and the faction AI cap hold them back."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Opening force"
     m_sValues "Spawn At Start On, triggers Off"
    }
    DCO_SettingSetup {
     m_sName "Sustain"
     m_sValues "Manpower Below 30, Commander Request On, Cooldown 300 s"
    }
   }
   m_sPitfalls "Several groups per spawn with a short cooldown can overload the server; set the faction AI cap."
  }
  DCO_SettingSubHelp {
   m_sCategory "CommanderStyle"
   m_sPurpose "The commander's personality and attack limits."
   m_sInteract "Aggression and Risk Taking decide when it attacks; Patience and Resilience decide how long it persists; Reserve and All-in decide how much it commits."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Cautious"
     m_sValues "Aggression 0.25, Risk 0.2, Patience 0.7, Reserve 30%"
    }
    DCO_SettingSetup {
     m_sName "Balanced"
     m_sValues "All 0.5, Reserve 20%"
    }
    DCO_SettingSetup {
     m_sName "Aggressive"
     m_sValues "Aggression 0.75, Risk 0.7, Patience 0.4, Reserve 15%"
    }
   }
   m_sPitfalls "All-in with Include Rear Defenders leaves rear objectives empty. Removing Fire and Maneuver from Allowed Tactics can leave the commander with nothing to fall back on."
  }
  DCO_SettingSubHelp {
   m_sCategory "CommanderThreat"
   m_sPurpose "How the commander answers enemy threats with reinforcements, flanks and artillery."
   m_sInteract "Min Response Score gates any response, Engage Threshold gates normal reinforcements, Priority Threshold marks urgent ones. Cooldown and Max Reinforcements limit how much is sent."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Reactive"
     m_sValues "Min Response 15, Engage 20, Think 20 s"
    }
    DCO_SettingSetup {
     m_sName "Default"
     m_sValues "Min Response 25, Engage 30, Think 30 s"
    }
    DCO_SettingSetup {
     m_sName "Focused on objectives"
     m_sValues "Min Response 40, Engage 50"
    }
   }
   m_sPitfalls "Keep Priority Threshold above Engage Threshold. A very short think interval costs CPU with many threats."
  }
  DCO_SettingSubHelp {
   m_sCategory "DCO_Waypoint"
   m_sPurpose "How this waypoint completes and how a garrison fills buildings."
   m_sInteract "Fill Ratio and Max Buildings decide the spread; Fill Order and Threat Weight decide which slots are taken first."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Strongpoint"
     m_sValues "Fill Ratio 1, Max Buildings 1"
    }
    DCO_SettingSetup {
     m_sName "Spread defense"
     m_sValues "Fill Ratio 0.5, Max Buildings 0"
    }
   }
   m_sPitfalls "Fill changes apply the next time the garrison starts."
  }
  DCO_SettingSubHelp {
   m_sCategory "GarrisonRelease"
   m_sPurpose "When a Defend or Release garrison may leave its buildings."
   m_sInteract "Defend uses the flank team and leash; Release uses the casualty, distance and suppression triggers."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Stubborn"
     m_sValues "Release casualties 70%, distance 15 m"
    }
    DCO_SettingSetup {
     m_sName "Mobile"
     m_sValues "Release casualties 30%, distance 50 m, Return After Release On"
    }
   }
   m_sPitfalls "Setting every release trigger to 0 makes a Release garrison behave like Hold."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalCQB"
   m_sPurpose "Fighting in buildings: when squads clear buildings, how they do it, and whether captures wait for it."
   m_sInteract "Clear Buildings enables the drill; the other settings shape it. Capture Waits and the Occupied Building Timeout decide how long an objective can be held up by buildings."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Thorough clearing"
     m_sValues "Clear Buildings On, Capture Waits On, Timeout 180 s"
    }
    DCO_SettingSetup {
     m_sName "Fast captures"
     m_sValues "Clear Buildings On, Capture Waits Off"
    }
    DCO_SettingSetup {
     m_sName "No CQB"
     m_sValues "Clear Buildings Off"
    }
   }
   m_sPitfalls "Capture Waits with a long timeout can stall captures around quiet buildings. CQB is one of the more CPU-heavy features in dense towns."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalCombat"
   m_sPurpose "Individual soldier behaviors DCO adds on top of vanilla: how soldiers shoot, move, hear and react."
   m_sInteract "Each switch enables one behavior. Most are cheap; Lean Peek and Awareness cost a little more CPU in big fights."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Full tactical"
     m_sValues "Everything On"
    }
    DCO_SettingSetup {
     m_sName "Lighter server"
     m_sValues "Lean Peek Off, Awareness Off, rest On"
    }
   }
   m_sPitfalls "Turning off Reaction Time makes AI react instantly and feel unfair. AI Hears Player Voice surprises players who talk near enemies."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalCommander"
   m_sPurpose "Rules for every commander: tactic re-evaluation, stock, spawn cap and contact reporting."
   m_sInteract "Tactic Re-evaluation uses the stall threshold every 2 minutes. Contact report settings of 0 fall back to each group's own values."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Default"
     m_sValues "Re-evaluation On, Stall 15%, Stock -1, Cap 0"
    }
   }
   m_sPitfalls "A spawn cap of 0 means no cap; set one on busy servers."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalContactSharing"
   m_sPurpose "How AI squads share enemy contacts with each other and what players see of it."
   m_sInteract "Voice works within Voice Range without radios; radio works within Short Radio Range, optionally only between squads with radios. Every hop and distance adds position error."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Realistic"
     m_sValues "Sharing On, Require Radio On, Hops 1"
    }
    DCO_SettingSetup {
     m_sName "Default"
     m_sValues "Sharing On, Require Radio Off, Hops 2"
    }
    DCO_SettingSetup {
     m_sName "Coop friendly"
     m_sValues "Default plus Notify Players On and Contacts on Map On"
    }
   }
   m_sPitfalls "Contact Sharing Log writes a lot of lines; only use it while debugging."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalIdle"
   m_sPurpose "What groups without orders do: take cover, hold, and when to leave cover."
   m_sInteract "Idle Enter Time starts idle; Overrun Distance and the two Leave settings decide when idle soldiers move again."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Passive"
     m_sValues "Leave to Assist Off, Leave to Investigate Off"
    }
    DCO_SettingSetup {
     m_sName "Default"
     m_sValues "Leave to Assist On, Leave to Investigate Off"
    }
    DCO_SettingSetup {
     m_sName "Responsive"
     m_sValues "Leave to Assist On, Leave to Investigate On"
    }
   }
   m_sPitfalls "Turning off Follow Commander Orders removes idle groups from the commander's pool."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalMedic"
   m_sPurpose "Medics helping casualties outside their own group, including players."
   m_sInteract "Cross-Group Medic enables lending; the radii limit how far a medic travels; Max Medics Lent protects the lending group."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Default"
     m_sValues "Cross-Group On, Treat Players On, Under Fire On, Bleeding 150 m, Unconscious 300 m"
    }
    DCO_SettingSetup {
     m_sName "Own group only"
     m_sValues "Cross-Group Off"
    }
   }
   m_sPitfalls "Large radii pull medics away from their own squads in the middle of a fight."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalNight"
   m_sPurpose "Night fighting and long-range fire discipline."
   m_sInteract "Night Behavior enables flares and later engagement; Night Engage Distance scales both defensive engage range and the rifle/MG effective ranges at night."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Realistic night"
     m_sValues "Night Behavior On, Engage 0.6, Light Discipline On"
    }
    DCO_SettingSetup {
     m_sName "Day-like night"
     m_sValues "Night Behavior Off"
    }
   }
   m_sPitfalls "A very low Night Engage Distance makes defenders let attackers walk right up to them."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalPlayers"
   m_sPurpose "What players see and hear from the AI: map overlay, operation radio and artillery warnings."
   m_sInteract "Overlay Mode picks which friendly groups appear; the radius limits which objectives are shown."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Minimal"
     m_sValues "Overlay 0"
    }
    DCO_SettingSetup {
     m_sName "Default"
     m_sValues "Overlay 1, Radio 800 m, Artillery warning 400 m"
    }
    DCO_SettingSetup {
     m_sName "Full awareness"
     m_sValues "Overlay 2, Artillery warning 600 m"
    }
   }
   m_sPitfalls "Overlay 2 on a big server can clutter the map."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalReaction"
   m_sPurpose "How soldiers react to being shot at: suppression, cover, dodging, going prone and investigating unknown contacts."
   m_sInteract "Dodge Chance is limited by the shot threshold, the shot window and the cooldown; the cooldown is the main brake. Personality scaling shifts dodge and cover chances per soldier."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Steady soldiers"
     m_sValues "Dodge Chance 0.3, Shot Threshold 3, Cooldown 12 s, Suppression 0.8"
    }
    DCO_SettingSetup {
     m_sName "Default"
     m_sValues "Dodge Chance 0.6, Shot Threshold 1, Cooldown 8 s, Suppression 1"
    }
    DCO_SettingSetup {
     m_sName "Jumpy soldiers"
     m_sValues "Dodge Chance 0.8, Shot Threshold 1, Cooldown 5 s, Suppression 1.4"
    }
   }
   m_sPitfalls "A low cooldown with automatic fire keeps soldiers running between covers instead of fighting. Prone Chance 0 disables all prone behavior."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalSpecialists"
   m_sPurpose "Specialist roles (MG, AT, marksman, leader, RTO, grenadier) and ammunition recovery."
   m_sInteract "Role switches make specialists fight their role. Rearm and recovery keep squads supplied and let riflemen take over fallen specialists' weapons."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Full"
     m_sValues "Everything On"
    }
    DCO_SettingSetup {
     m_sName "Roles only"
     m_sValues "Roles On; Rearm, Recovery, Enemy sources, Enemy weapons Off"
    }
   }
   m_sPitfalls "Rearm does nothing useful while Magic Magazine is on."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalSquadDrills"
   m_sPurpose "Squad-level drills and movement: ambush reaction, break contact, bounding, cohesion and when a squad pushes."
   m_sInteract "Advance When Superior and Overmatch decide when a squad moves forward; cohesion decides how spread it is while doing so."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Aggressive infantry"
     m_sValues "Overmatch On, Advance ratio 1.5, Overmatch distance 350 m"
    }
    DCO_SettingSetup {
     m_sName "Cautious infantry"
     m_sValues "Advance ratio 3.0, Overmatch distance 150 m"
    }
    DCO_SettingSetup {
     m_sName "Tight squads"
     m_sValues "Cohesion Open 20 m, Urban 10 m"
    }
   }
   m_sPitfalls "Urban cohesion larger than Open cohesion spreads squads through town blocks. A very low advance ratio makes squads charge into bad fights."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalSystem"
   m_sPurpose "Server-wide technical settings: how detailed commander AI is simulated and which diagnostic logs run."
   m_sInteract "AI LOD Mode trades CPU for distant AI activity. Profiling and census only add logging; they do not change behavior."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Normal server"
     m_sValues "AI LOD Mode Vanilla, Performance Profiling Off, Census Logging Off"
    }
    DCO_SettingSetup {
     m_sName "Performance testing"
     m_sValues "Performance Profiling On, Census Logging On, Census Interval 30 s"
    }
   }
   m_sPitfalls "Full Detail with many commander groups can drop server FPS hard. Census is not saved and turns off after a restart."
  }
  DCO_SettingSubHelp {
   m_sCategory "Individual"
   m_sPurpose "Personality and ammo of this single soldier."
   m_sInteract "Personality affects dodging, cover, targets and boldness."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Veteran NCO"
     m_sValues "Personality Measured"
    }
   }
   m_sPitfalls "Magic Magazine on a single soldier makes him never run dry."
  }
  DCO_SettingSubHelp {
   m_sCategory "IndividualReaction"
   m_sPurpose "How this single soldier reacts to fire, overriding the global values."
   m_sInteract "Same meaning as the global Reaction settings."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Stoic MG gunner"
     m_sValues "Dodge Chance 0.1, Suppression 0.6"
    }
   }
   m_sPitfalls "Individual overrides are easy to forget; they stay until changed."
  }
  DCO_SettingSubHelp {
   m_sCategory "IndividualSkill"
   m_sPurpose "Combat skill of this single soldier, overriding the global values."
   m_sInteract "Same meaning as the global Skill settings."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Sniper"
     m_sValues "Skill Preset Expert, Aim Accuracy 1.0, Aim Shake 1.5, Aim Speed 1.2, Perception 2.5"
    }
   }
   m_sPitfalls "Very high values make one soldier dominate the fight."
  }
  DCO_SettingSubHelp {
   m_sCategory "Squad"
   m_sPurpose "This squad's own behavior: posture, engagement distances, reactions and simulation detail."
   m_sInteract "These settings override the global values for this squad only."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Stealthy recon"
     m_sValues "Tactics Sneak, Contact SOP Observe, Engagement 200 m"
    }
    DCO_SettingSetup {
     m_sName "Hold the line"
     m_sValues "Tactics Defensive, Retreat When Never"
    }
   }
   m_sPitfalls "Retreat When Never makes a squad fight to the last man even when hopeless."
  }
  DCO_SettingSubHelp {
   m_sCategory "SquadCommand"
   m_sPurpose "Identity of this commander and how it handles player groups."
   m_sInteract "Faction and Mode define what it fights for and how; player order times decide how long it waits for players."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Offensive side"
     m_sValues "Mode Offensive"
    }
    DCO_SettingSetup {
     m_sName "Holding side"
     m_sValues "Mode Defensive"
    }
   }
   m_sPitfalls "Changing Faction releases every group and vehicle this commander controls."
  }
  DCO_SettingSubHelp {
   m_sCategory "SquadCommander"
   m_sPurpose "What the AI Commander may do with this squad."
   m_sInteract "Turning off Commander Can Task removes the squad from all commander plans; the other switches allow or forbid single kinds of jobs."
   m_aSetups {
    DCO_SettingSetup {
     m_sName "Full control"
     m_sValues "All On"
    }
    DCO_SettingSetup {
     m_sName "GM-controlled squad"
     m_sValues "Commander Can Task Off"
    }
   }
   m_sPitfalls "A squad with everything Off is invisible to the commander."
  }
  DCO_SettingSubHelp {
   m_sCategory "CommanderROE"
   m_sPurpose "Fire discipline for this commander's squads, set per task: when they may open fire and from how far."
   m_sInteract "Mode decides how freely a squad may fire; Range is how far away it may open fire. Simple mode Fire discipline sets the modes together."
  }
  DCO_SettingSubHelp {
   m_sCategory "CommanderPlayers"
   m_sPurpose "How this commander hands tasks to player groups and how long it waits for an answer and for players to arrive."
   m_sInteract "Task Player Groups switches player orders on; the timing values decide when a player task is given up or released early. Counted player groups are planned like AI squads."
  }
  DCO_SettingSubHelp {
   m_sCategory "CommanderDoctrine"
   m_sPurpose "Which battle, defense and support plans this commander prefers, overriding the global doctrine for this commander only."
   m_sInteract "Each plan list is used for its own situation (strong, favorable, equal, weaker, unknown). Leave a row empty to follow the global doctrine."
  }
  DCO_SettingSubHelp {
   m_sCategory "CommanderPersonality"
   m_sPurpose "Character of this commander: how bold, patient, careful and adaptive it plays."
   m_sInteract "Traits shift attack ratios, retreat depth, think rate and how long it waits in a stalemate. A preset fills all traits at once; Random Personality rolls them at start."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalDoctrineBattle"
   m_sPurpose "Default attack plans for every commander, chosen by how the own force compares to the enemy."
   m_sInteract "A commander picks a tactic from the list that matches the force ratio. Per-commander doctrine overrides these lists."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalDoctrineDefense"
   m_sPurpose "Default defense plans for every commander, chosen by how the own force compares to the attacker."
   m_sInteract "Used when a commander defends an objective. Per-commander doctrine overrides these lists."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalDoctrineSupport"
   m_sPurpose "What support every commander may use: supplies, reinforcements, fire support, medevac, plus timing rules."
   m_sInteract "Support types switched off here are never requested. Reserve and attack ratio decide how much force a commander holds back."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalDoctrineForce"
   m_sPurpose "How many squads a commander sends to each kind of mission (attack, recon, support by fire, garrison and more)."
   m_sInteract "Min and max limit each mission; share values scale with the commander's total force. Higher limits commit more squads at once."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalVehicles"
   m_sPurpose "How AI drivers and crews fight with vehicles: hiding, shoot-and-scoot, firing positions, recon by fire and withdraw."
   m_sInteract "Values are set per vehicle class (soft-skin, APC, tank). Active Vehicle Driver must be on for the other vehicle settings to work."
  }
  DCO_SettingSubHelp {
   m_sCategory "GlobalGroupPresets"
   m_sPurpose "Who may copy group presets onto this server."
   m_sInteract "Set by the server owner; players without permission can still use presets that are already on the server."
  }
 }
}
