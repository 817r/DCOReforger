  DCO_SettingHelp {
   m_sAttribute "DCO_DocBattleStrongAttribute"
   m_iBeta 1
   m_sWhat "Prep steps and attack types allowed against an objective when the force ratio there is Strong (2 : 1 or better after enemy posture)."
   m_sLow "Nothing checked: no attack type fits, so the objective is skipped (no Wait); recon, staging and reserve follow personality."
   m_sHigh "More checked: more attack types (still limited by Allowed Tactics); checked Recon, Staged prep, Barrage and Keep reserve become mandatory."
   m_sRecommended "Preset value (Default: Staged prep, Direct, Coordinated flanking, Withdraw, Fallback, Reserve advised)."
   m_iPerf 0
   m_sRelated "DCO_DocPresetAttribute DCO_CommanderAllowedTacticsAttribute DCO_T_CMD_UseSynchronizedAttackAttribute"
   m_aEffectPerOption {
    "The attack waits until a recon squad has scouted the objective, up to the Recon Timeout. If the picture is still unclear, the commander uses Movement to Contact or waits. Unticked, recon only happens by chance."
    "Squads gather at a staging point and attack together. Unticked, each squad goes in as soon as it gets a slot. This decides staging whenever this doctrine row is in use."
    "Mortars or artillery fire 6 rounds on the best known target, or on the objective, before the assault, which then waits 45 s. Needs mortars or artillery."
    "Allows a direct Fire and Maneuver assault."
    "Allows Flanking, Pincer and Hammer and Anvil attacks."
    "Allows Raids."
    "Allows Attack by Fire and Siege: the enemy is engaged from a distance instead of assaulted."
    "If no attack type is ticked or fits, the commander holds and checks again until the Wait Timeout instead of skipping the objective. It attacks if the odds improve."
    "No extra effect in this row: an attack that passes Retreat Loss withdraws anyway unless Fallback is ticked. Withdraw matters in the Weaker row."
    "When losses pass Retreat Loss (off in most doctrines), squads pull back to a nearby held position or their staging point instead of a supply hub."
    "While this attack runs, the commander keeps part of its force back as a reserve (Reserve share, 25 % by default)."
    "Same as Keep reserve, but only for commanders that are not very aggressive."
   }
  }
