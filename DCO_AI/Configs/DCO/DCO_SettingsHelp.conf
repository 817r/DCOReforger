DCO_SettingsHelpConfig {
 m_aHelp {
  DCO_SettingHelp {
   m_sAttribute "DCO_T_AGG_ProfileAttribute"
   m_iBeta 1
   m_sWhat "Scales cover wait, open wait, closing distance, suppression tolerance, superiority ratio and forward-bound chance with the AI Aggression slider. Slider 1 = unchanged."
   m_sLow "Off: the slider only changes personalities and cover/dodge chance at spawn."
   m_sHigh "On: higher aggression means less waiting and closer pressure; 1 equals Off."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_AggressionAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_AGG_BoundV2Attribute"
   m_iBeta 1
   m_sWhat "Soldiers bound cover-to-cover more often when the AI is set more aggressive."
   m_sLow "Off: higher aggression makes soldiers bound less."
   m_sHigh "On: higher aggression and bolder personalities bound more."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_AggressionAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_AGG_RetfireAttribute"
   m_iBeta 1
   m_sWhat "Fires back toward unseen shooters (battle drill: return fire)."
   m_sLow "Off: soldiers only take cover from unseen fire."
   m_sHigh "On: some soldiers fire back toward the shooter at once."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_AggressionAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_TM_OpenRuleV2Attribute"
   m_iBeta 1
   m_sWhat "How soldiers react when they are stuck standing still in the open during a fight."
   m_sLow "Off: only alerted, calm soldiers move off the open ground."
   m_sHigh "On: vigilant and shaken soldiers also rush to cover or go prone and crawl instead of standing in the open."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_CM_DirDecodeAttribute"
   m_iBeta 1
   m_sWhat "How combat move directions (forward, back, flank) are worked out."
   m_sLow "Off: soldiers use the raw move position; a fall back can end up sideways."
   m_sHigh "On: forward, back and flank moves are relative to the enemy, so falling back really goes away from him."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_TM_AtkCloseInAttribute"
   m_iBeta 1
   m_sWhat "How close attacking squads push before they stop and fight from where they are."
   m_sLow "Off: attackers stop at 30/50/80 m (by posture) and fight from there."
   m_sHigh "On: attackers keep pushing to about 12/20/32 m, into assault range."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_BC_ShakenAttribute"
   m_iBeta 1
   m_sWhat "Whether a squad pulls back when most of its soldiers are shaken."
   m_sLow "Off: a shaken squad stays and fights until it is overrun or loses most of its men."
   m_sHigh "On: when most soldiers are shaken the squad breaks contact, regroups and recovers before fighting again."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_BC_LadderSliderAttribute"
   m_iBeta 1
   m_sWhat "At what losses a squad switches to defensive or evasive posture."
   m_sLow "Off: squads keep attacking until almost wiped out (about 90-95% losses)."
   m_sHigh "On: at the default slider, squads go defensive at 50% losses and evasive at 70%; a higher AI Aggression slider pushes these later."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_OPP_ExposedAttribute"
   m_iBeta 1
   m_sWhat "Prefers enemies in the open and shoots them sooner."
   m_sLow "Off: target choice is distance, threat and weapon only."
   m_sHigh "On: enemies crossing open ground are engaged first and faster."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_AggressionAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_OPP_DistractedAttribute"
   m_iBeta 1
   m_sWhat "Uses enemies that look away to flank them."
   m_sLow "Off: soldiers ignore where the enemy is looking."
   m_sHigh "On: soldiers slip around enemies busy with someone else."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_AggressionAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_OPP_PushAttribute"
   m_iBeta 1
   m_sWhat "Closes in on enemies that stopped shooting back."
   m_sLow "Off: soldiers only advance on squad orders."
   m_sHigh "On: soldiers close in on suppressed enemies on their own."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_AggressionAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_CTX_OnAttribute"
   m_iBeta 1
   m_sWhat "Combat behavior depends on the range band to the enemy and the terrain type (open, forest, urban, indoor)."
   m_sLow "Off: one behavior profile for every range and terrain."
   m_sHigh "On: fire mode, aim, grenades, bounding and search change with range and terrain."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_CTX_MgFloorAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_CTX_MgFloorAttribute"
   m_iBeta 1
   m_sWhat "MG/AR gunners keep full suppressive fire volume regardless of their own threat level."
   m_sLow "Off: MG/AR fire less when they feel safe or the enemy is far."
   m_sHigh "On: MG/AR suppress at full rate as the base of fire."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_CTX_OnAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_CTX_SupOnAttribute"
   m_iBeta 1
   m_sWhat "Soldiers keep suppressing the last known enemy spot while a squad mate moves during an assault."
   m_sLow "Off: soldiers only fire at enemies they can see."
   m_sHigh "On: moving mates are covered by suppressive fire (8-30 s windows)."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_CTX_OnAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_CTX_HideOnAttribute"
   m_iBeta 1
   m_sWhat "Infantry decide when to hide from a threat using the combat context range bands."
   m_sLow "Off: fixed hide distances 40 m / 250 m."
   m_sHigh "On: hide distances 50 m / 400 m from the range bands."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_CTX_OnAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_CTX_CqbGateAttribute"
   m_iBeta 1
   m_sWhat "Room clearing is only started for buildings the CQB planner can plan."
   m_sLow "Off: every indoor last-known position is handed to room clearing."
   m_sHigh "On: unplannable buildings (no outside door / no rooms) are skipped."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_CTX_OnAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_HEAL_UnseenGateAttribute"
   m_iBeta 1
   m_sWhat "Healing waits while an unseen shooter is close (care under fire: cover first)."
   m_sLow "Off: soldiers and medics heal even under close unseen fire."
   m_sHigh "On: cover first, heal after the unseen fire stops (max 6 s window)."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_DODGE_CoverVsShooterAttribute"
   m_iBeta 1
   m_sWhat "Cover only stops a dodge when it really protects against the current shooter."
   m_sLow "Off: any cover stops the dodge."
   m_sHigh "On: compromised cover (shooter can see the soldier, hit, repeated near misses) triggers a dodge."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_DODGE_NearmissGateAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_DODGE_NearmissGateAttribute"
   m_iBeta 1
   m_sWhat "Close near misses and hits trigger a dodge even at low threat."
   m_sLow "Off: low threat only lowers the stance."
   m_sHigh "On: near misses within 1.5 m / 2x within 5 m / hits trigger a dodge."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_DODGE_CoverVsShooterAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_DODGE_DirAssistAttribute"
   m_iBeta 1
   m_sWhat "Dodges move to a spot the known shooters cannot see, sideways first."
   m_sLow "Off: dodge direction is random/personality based."
   m_sHigh "On: line-of-sight breaking spot, never towards the enemy."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_DODGE_CoverVsShooterAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_TB_OnAttribute"
   m_iBeta 1
   m_sWhat "Fireteams bound in turns: one team moves only while the other is set and firing at the last known enemy spot."
   m_sLow "Off: old time-sliced bounding; teams can move without covering fire."
   m_sHigh "On: every bound is covered by the other team's fire."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_TB_FmAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_TB_FmAttribute"
   m_iBeta 1
   m_sWhat "An attacking squad in contact at 50-300 m splits: the MG/AR team becomes the base of fire and the other team flanks and assaults at 40 m. Needs Squad Bounding Handshake on."
   m_sLow "Off: the whole squad advances on the same line."
   m_sHigh "On: the squad fixes the enemy with fire and assaults from a flank."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_TB_OnAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_TGT_ClaimAttribute"
   m_iBeta 1
   m_sWhat "Squad members spread their fire over different enemies. An enemy shooting at the soldier still comes first; MGs may stack on one target."
   m_sLow "Off: the whole squad tends to shoot the same enemy."
   m_sHigh "On: several enemies are kept under fire at once."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_MB_OnAttribute"
   m_iBeta 1
   m_sWhat "Soldiers leave cover as soon as it stops protecting them, and attackers advance once friendly fire covers them or the enemy goes quiet (at most 25 s wait)."
   m_sLow "Off: old random 30-180 s cover waits."
   m_sHigh "On: movement follows the fight instead of timers."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_MB_FieldAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_MB_FieldAttribute"
   m_iBeta 1
   m_sWhat "When no real cover is found, a moving soldier picks the nearest dip, rock, tree or fence that blocks fire from the enemy and goes prone or crouches there."
   m_sLow "Off: without real cover the soldier stops in the open."
   m_sHigh "On: soldiers use small terrain cover on the move."
   m_sRecommended "On."
   m_iPerf 1
   m_sRelated "DCO_T_MB_OnAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_GREN_AtkCloseAttribute"
   m_iBeta 1
   m_sWhat "Attacking soldiers may still throw frags at enemies within 35 m while under heavy fire (up to 2x the normal threat limit, never in panic)."
   m_sLow "Off: vanilla threat limit; heavy fire stops grenade throws."
   m_sHigh "On: close assaults keep using grenades under fire."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "SCR_AIGlobalGrenadeUsageAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_TB_FmGateAttribute"
   m_iBeta 1
   m_sWhat "In Squad Fire and Maneuver the assaulting team stops before the last 15 m and waits up to 15 s until the base-of-fire team has fired, so the final rush is covered."
   m_sLow "Off: the assault goes in without waiting for covering fire."
   m_sHigh "On: the last rush starts only under covering fire (or after 15 s)."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_TB_FmAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_TB_MgOwAttribute"
   m_iBeta 1
   m_sWhat "In contact the fireteam with the MG/AR does not take bounding turns and keeps firing; it moves up only when the rest of the squad is more than 40 m ahead."
   m_sLow "Off: MG teams bound like other teams and stop firing while moving."
   m_sHigh "On: the MG stays on overwatch for the whole contact."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_TB_OnAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_MB_MgExemptAttribute"
   m_iBeta 1
   m_sWhat "MG/AR gunners are not moved by Trigger-Based Movement during contact, so they keep their firing position."
   m_sLow "Off: MG gunners leave their position to advance like riflemen."
   m_sHigh "On: MG gunners stay put and keep firing."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_MB_OnAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_SA_HazardSkipAttribute"
   m_iBeta 1
   m_sWhat "AI do not use a post or loiter spot (smart action) that lies within 1.5 m of barbed wire or an anti-personnel mine, so they do not get cut standing there."
   m_sLow "Off: AI may stand next to barbed wire at camp posts and get hurt."
   m_sHigh "On: such spots are closed and the AI picks another."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_MB_V2Attribute"
   m_iBeta 1
   m_sWhat "Moving soldiers score nearby cover spots by protection, progress and spacing, and only move when the new spot is clearly better than where they are."
   m_sLow "Off: the older nearest-cover pick."
   m_sHigh "On: soldiers stay put unless a better spot exists."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FF_VertAttribute"
   m_iBeta 1
   m_sWhat "The friendly fire lane check uses the real muzzle height of the shooter stance, so a prone or crouched friend below the line of fire does not block the shot."
   m_sLow "Off: any friend near the lane blocks the shot."
   m_sHigh "On: friends clearly below or above the line of fire do not block it."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_COV_OnAttribute"
   m_iBeta 1
   m_sWhat "When a soldier looks for cover, the candidates are scored by hardness, protection against the threat and distance instead of taking the first one."
   m_sLow "Off: vanilla first-found cover."
   m_sHigh "On: the most protective nearby cover is used (vanilla pick as fallback)."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_CQB_KindBehAttribute"
   m_iBeta 1
   m_sWhat "Within close quarters range soldiers move differently indoors (walk, short steps, never stop in a doorway) and outdoors (short sprints to cover or sidesteps when not covered)."
   m_sLow "Off: vanilla movement at close range."
   m_sHigh "On: close-range moves are short and cover to cover."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_OSC_FixDirAttribute"
   m_iBeta 1
   m_sWhat "A soldier keeps his last move direction for a few seconds and does not reverse it right away, which stops back-and-forth stepping."
   m_sLow "Off: direction can flip every move."
   m_sHigh "On: moves keep their direction for 8 s and no reverse for 15 s."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_OSC_FixCommitAttribute"
   m_iBeta 1
   m_sWhat "A new move request of the same kind does not replace a move that started less than 3 s ago."
   m_sLow "Off: every new request replaces the current move."
   m_sHigh "On: short moves finish before a new one starts."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_OSC_FixCoverAttribute"
   m_iBeta 1
   m_sWhat "Relocation cover search looks in a sector facing the threat instead of all around."
   m_sLow "Off: cover can be picked behind or beside the soldier."
   m_sHigh "On: cover is picked between the soldier and the threat side."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_OSC_FixShortAttribute"
   m_iBeta 1
   m_sWhat "A short relocation that gets interrupted is resumed instead of being dropped."
   m_sLow "Off: interrupted short moves are lost."
   m_sHigh "On: interrupted short moves resume (up to 3 times)."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_AGG_UsageMapAttribute"
   m_iBeta 1
   m_sWhat "Changes how the AI Aggression slider scales frag and grenade launcher usage, so every usage value still makes a difference."
   m_sLow "Off: used value = min(setting x slider x 2.5, 1); at the default slider every setting of 0.4 or more throws at the maximum."
   m_sHigh "On: used value = 1 - (1 - setting)^(slider x 2.5); 0.2 gives 0.43, 0.5 gives 0.82, 1 stays 1 at the default slider."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "SCR_AIGlobalGrenadeUsageAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_THR_LowClusterAttribute"
   m_sWhat "Stops the commander from ignoring a large threat just because each report about it was small."
   m_sLow "Off: a cluster made only of small, harmless reports is skipped, even with 9 enemies or a score far above the gate."
   m_sHigh "On: a cluster with 3 or more enemies, or a score of 1.5 times the gate, gets a response. More QRF and reinforcement missions."
   m_sRecommended "Off."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_LOGI_LowRelAttribute"
   m_sWhat "Decides when a squad asks the commander for ammo resupply."
   m_sLow "Off: fixed minimum of spare magazines; MG teams and squads with AT/GL soldiers ask for resupply from the start and every 3 minutes."
   m_sHigh "On: a soldier counts as low only when he is below the minimum and below the spares he started with."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_LOGI_ExtractIneffAttribute"
   m_sWhat "Decides which withdrawing squads the commander pulls back to the logistics hub."
   m_sLow "Off: every withdrawing squad is sent to the hub, even a full-strength garrison doing a short tactical withdraw; the objective is left empty."
   m_sHigh "On: only combat-ineffective squads go to the hub; the others finish their withdraw near the objective."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_LOGI_CrossSrcAttribute"
   m_sWhat "Stops the commander from telling a low-ammo squad to resupply at a hub that has no ammo."
   m_sLow "Off: squads within 200 m of the hub never get a RESUPPLY job, even when no arsenal or ammo truck is there; they stay low."
   m_sHigh "On: crosslevel only when an arsenal or resupply station is within 200 m; otherwise a RESUPPLY job is queued (log crosslevel_skip reason=no_ammo_source)."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_DEF_ShortfallAttribute"
   m_iBeta 1
   m_sWhat "Fills an objective that has too few defenders: a spare defender from a quiet objective first, otherwise groups from a spawner within its budget."
   m_sLow "Off: an objective that loses its defenders stays empty until the normal defense planning reassigns someone."
   m_sHigh "On: def_shortfall and def_reinf_request in the log; spawner groups arrive and garrison the objective."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_DEF_GarrisonFloorAttribute"
   m_iBeta 1
   m_sWhat "Sets a minimum number of defending groups per objective from its size and the enemies near it."
   m_sLow "Off: the defense cap alone decides how many groups an objective needs; threat responses may pull its last defenders."
   m_sHigh "On: larger and primary objectives ask for up to 3 groups, and def_floor_block in the log shows a defender kept in place."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_GRP_BcNotFreeAttribute"
   m_iBeta 1
   m_sWhat "A squad that is breaking contact finishes its withdrawal before the commander gives it a new task."
   m_sLow "Off: a withdrawing squad that pauses can be picked as a reserve and sent back toward the enemy."
   m_sHigh "On: reserve:skip_breaking_contact in the perf log shows the commander skipping a withdrawing squad."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_THR_FlankFriendAttribute"
   m_sWhat "Places the counter-flank at a right angle to the friendly group that is in contact, so the enemy is hit from a second direction."
   m_sLow "Off: flank point measured from the flanking group's own approach; it can end up on the same side as the friendly group or cross its fire."
   m_sHigh "On: flank point about 90 degrees off the friendly contact line; falls back to the old rule when no friendly group is in contact."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_THR_FlankRouteAttribute"
   m_sWhat "Keeps a counter-flanking group from running straight across the enemy's front on its way to the flank point."
   m_sLow "Off: straight route, only water and enemy objectives are avoided."
   m_sHigh "On: adds one detour waypoint at the flank distance when the straight line comes closer than 80% of it."
   m_sRecommended "Off."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_THR_FlankRetargetAttribute"
   m_sWhat "Moves the counter-flank's final assault point to where the enemy is now, instead of where he was when the flank was ordered."
   m_sLow "Off: the group assaults the position the enemy had when the flank was sent."
   m_sHigh "On: the assault point follows the enemy (checked every 45 s, when he moved 30 m or more)."
   m_sRecommended "On."
   m_iPerf 0
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_ObjTypeAttribute"
   m_iBeta 1
   m_sWhat "What the commander must do at this objective."
   m_sLow "Recon: watch it and report what is there."
   m_sHigh "Capture: take and hold the area. Destroy: destroy what is in it. Defend: keep it. Hold until: keep it until the deadline."
   m_sRecommended "Capture."
   m_iPerf 0
   m_sTerms "objective type"
   m_aEffectPerOption {
    "Commanders attack to take the area and then hold it. They prefer a real assault."
    "Commanders attack it and prefer raids, attack by fire and sieges. With Destroy Targets set in Workbench, it is done when those targets are destroyed, and fails at the deadline."
    "Commanders never attack it. They send one squad to watch it from a distance and report what is there."
    "The defending side must still own it after the Type Time. It fails if an enemy captures it."
    "Done when one side owns it for the Type Time without a break. Fails if the deadline passes first."
   }
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_ObjTypeTimeAttribute"
   m_iBeta 1
   m_sWhat "How long the objective must be kept. Defend and Hold until only."
   m_sLow "Short: a quick defense or a short hold; the mission ends sooner."
   m_sHigh "Long: a long defense or hold; the attacker gets more time to take it."
   m_sRecommended "Defend 1200 s (20 min). Hold until 300-600 s."
   m_iPerf 0
   m_sTerms "type time, defend time, hold time"
   m_sRelated "DCO_ObjTypeAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_ObjTypeFactionAttribute"
   m_iBeta 1
   m_sWhat "Which side the objective type is about."
   m_sLow "Auto: Defend = owner at mission start, Hold until = any side, Destroy = any side that did not own it at start."
   m_sHigh "A faction: only that side defends, holds or must destroy."
   m_sRecommended "Auto, unless the objective starts neutral (Defend needs an owner or a faction)."
   m_iPerf 0
   m_sTerms "type faction, defender"
   m_sRelated "DCO_ObjTypeAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_ObjTypeDeadlineAttribute"
   m_iBeta 1
   m_sWhat "Time limit for Hold until and Destroy. Not used by Defend."
   m_sLow "0: no deadline; the objective stays open until done."
   m_sHigh "A value: the objective fails when the time passes unfinished."
   m_sRecommended "0, or the mission length for timed missions."
   m_iPerf 0
   m_sTerms "deadline"
   m_sRelated "DCO_ObjTypeAttribute"
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_ObjTypeDefendRatioAttribute"
