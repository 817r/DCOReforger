   m_sWhat "Seconds without getting 3 m closer to the leader that count as stuck. He tries another point once, then is marked stuck."
   m_sLow "10 s: soldiers are quickly declared stuck."
   m_sHigh "300 s: a blocked soldier keeps trying for 5 minutes per attempt."
   m_sRecommended "Default (30 s)."
   m_iPerf 0
   m_sRelated "DCO_T_GA_StragglerEnabledAttribute DCO_T_GA_StragglerTimeAttribute"
   m_sEffect "No progress toward the leader for %1 s counts as stuck."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_RadiusScaleAttribute"
   m_iBeta 1
   m_sWhat "Multiplies the building search radius of indoor position searches (combat move indoors 70 m, idle take cover 50 m)."
   m_sLow "0.25: soldiers only consider spots close to the search point."
   m_sHigh "3: they search much farther through buildings, with more candidates."
   m_sRecommended "Default (1)."
   m_iPerf 1
   m_sRelated "DCO_T_FI_MaxCandidatesScaleAttribute DCO_T_FI_CandidatesPerTickScaleAttribute"
   m_sEffect "Indoor search radius x%1."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_CandidatesPerTickScaleAttribute"
   m_iBeta 1
   m_sWhat "Multiplies how many indoor spots each soldier scores per behaviour tick (base 5-6). Each tick is also cut off after about 1 ms."
   m_sLow "0.25: searches take several times longer before a soldier moves."
   m_sHigh "3: results come faster but each tick costs more CPU."
   m_sRecommended "Default (1)."
   m_iPerf 2
   m_sRelated "DCO_T_FI_MaxCandidatesScaleAttribute DCO_T_FI_RadiusScaleAttribute"
   m_sEffect "Indoor spots scored per tick x%1."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_MaxCandidatesScaleAttribute"
   m_iBeta 1
   m_sWhat "Multiplies the most indoor spots scored before the search stops and takes the best found (base 150, 500 for combat moves indoors)."
   m_sLow "0.25: searches stop early; large buildings may give poor spots or none."
   m_sHigh "3: more of large buildings is searched, at more CPU per search."
   m_sRecommended "Default (1)."
   m_iPerf 2
   m_sRelated "DCO_T_FI_CandidatesPerTickScaleAttribute DCO_T_FI_RadiusScaleAttribute"
   m_sEffect "Max indoor spots scored x%1."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_MaxTileWaitTicksAttribute"
   m_iBeta 1
   m_sWhat "Most behaviour ticks an indoor search waits for a navmesh tile to load before it ends with what it has found."
   m_sLow "1: searches in unloaded areas end almost at once, often with no spot."
   m_sHigh "100: searches wait much longer for the navmesh before giving up."
   m_sRecommended "Default (20)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_MaxCandidatesScaleAttribute"
   m_sEffect "Searches wait up to %1 ticks for the navmesh."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_GoodEnoughScoreAttribute"
   m_iBeta 1
   m_sWhat "Indoor spot score (0-1) at which the search stops and takes the spot at once. Real scores top out near 0.87."
   m_sLow "0: the first valid spot is taken; fast but often poor."
   m_sHigh "Above about 0.87: never reached, so every search runs to its limit."
   m_sRecommended "Default (0.72)."
   m_iPerf 1
   m_sRelated "DCO_T_FI_MaxCandidatesScaleAttribute DCO_T_FI_TopCandidatesAttribute"
   m_sEffect "Spots scoring %1 or more are taken at once."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_ResultTTLAttribute"
   m_iBeta 1
   m_sWhat "Seconds a found indoor spot stays valid; after that the soldier searches again and may move to a better spot."
   m_sLow "1 s: constant re-searching; soldiers may hop between spots."
   m_sHigh "120 s: soldiers keep their spot for 2 minutes even if the fight changes."
   m_sRecommended "Default (15 s)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_StickinessBonusAttribute"
   m_sEffect "Indoor spots are searched again after %1 s."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_CellSizeAttribute"
   m_iBeta 1
   m_sWhat "Horizontal size (m) of the grid used to sample spots in a building; one sample per cell."
   m_sLow "0.5 m: very fine sampling with many more candidates and traces (more CPU)."
   m_sHigh "10 m: coarse sampling; small rooms may be missed."
   m_sRecommended "Default (2.5 m)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_CellHeightAttribute DCO_T_FI_DedupeRadiusAttribute"
   m_sEffect "Spots are sampled on a %1 m grid."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_CellHeightAttribute"
   m_iBeta 1
   m_sWhat "Height (m) of a sampling cell in a building, about one floor."
   m_sLow "1 m: several sample layers per floor, more candidates."
   m_sHigh "6 m: one layer spans two floors, so some floors can be missed."
   m_sRecommended "Default (3 m)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_CellSizeAttribute"
   m_sEffect "Sampling cells are %1 m high."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_DedupeRadiusAttribute"
   m_iBeta 1
   m_sWhat "Sampled spots that snap to the navmesh within this distance (m) of an already scored spot are skipped."
   m_sLow "0 m: no duplicate check; the same spot can be scored several times."
   m_sHigh "5 m: spots within 5 m count as duplicates; fewer spots per room are tried."
   m_sRecommended "Default (1 m)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_CellSizeAttribute"
   m_sEffect "Spots within %1 m of a scored one are skipped."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_TopCandidatesAttribute"
   m_iBeta 1
   m_sWhat "Number of best indoor spots kept for the final check; if the best one is occupied, the next is used."
   m_sLow "1: only the best spot is kept; if it is taken the search finds nothing."
   m_sHigh "10: more fallbacks, but fewer candidates are pruned early (more CPU)."
   m_sRecommended "Default (3)."
   m_iPerf 1
   m_sRelated "DCO_T_FI_GoodEnoughScoreAttribute DCO_T_FI_OccupancyRadiusAttribute"
   m_sEffect "The best %1 spots are kept as fallbacks."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_MinHeadroomAttribute"
   m_iBeta 1
   m_sWhat "Indoor spots with a ceiling lower than this (m) are rejected, so soldiers do not pick crawl spaces."
   m_sLow "1 m: low spaces under stairs or roofs are allowed."
   m_sHigh "3 m: only spots with 3 m clearance; many rooms are rejected."
   m_sRecommended "Default (1.6 m)."
   m_iPerf 0
   m_sRelated ""
   m_sEffect "Spots need at least %1 m headroom."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_OccupancyRadiusAttribute"
   m_iBeta 1
   m_sWhat "An indoor spot is rejected when another living soldier stands within this distance (m)."
   m_sLow "0.5 m: soldiers can pack shoulder to shoulder."
   m_sHigh "10 m: one soldier per 10 m; small buildings hold fewer soldiers."
   m_sRecommended "Default (3 m)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_MinBookedDistanceAttribute DCO_T_FI_WeightSpreadAttribute"
   m_sEffect "Spots within %1 m of another soldier are rejected."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_DoorBlockRadiusAttribute"
   m_iBeta 1
   m_sWhat "Indoor spots this close (m) to a door are rejected so soldiers do not stand in doorways."
   m_sLow "0 m: soldiers may stand in doorways and block them."
   m_sHigh "5 m: large zones around doors are excluded; small rooms may have no spot."
   m_sRecommended "Default (1.2 m)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_DoorAvoidRadiusAttribute DCO_T_FI_DoorAvoidPenaltyAttribute"
   m_sEffect "Spots within %1 m of a door are rejected."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_DoorAvoidRadiusAttribute"
   m_iBeta 1
   m_sWhat "Within this distance (m) of a door an indoor spot's score is cut, more the closer it is."
   m_sLow "0 m: no door penalty."
   m_sHigh "10 m: spots well away from doors are strongly preferred."
   m_sRecommended "Default (2.5 m)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_DoorAvoidPenaltyAttribute DCO_T_FI_DoorBlockRadiusAttribute"
   m_sEffect "Spots within %1 m of a door score lower."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_DoorAvoidPenaltyAttribute"
   m_iBeta 1
   m_sWhat "Score cut for an indoor spot right at a door, fading to 0 at Door Avoid Radius (spot scores run 0-1)."
   m_sLow "0: no door penalty."
   m_sHigh "1: spots near doors are almost never chosen."
   m_sRecommended "Default (0.3)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_DoorAvoidRadiusAttribute DCO_T_FI_DoorBlockRadiusAttribute"
   m_sEffect "Spots at a door lose %1 score."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_RejectChokepointsAttribute"
   m_iBeta 1
   m_sWhat "Rejects indoor spots in narrow gaps such as open door frames and bent corridors, measured with the existing cover rays."
   m_sLow "Off: soldiers may stop in narrow gaps and door frames."
   m_sHigh "On: spots narrower than Narrow Gap Width are rejected."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_FI_ChokepointWidthAttribute"
   m_aEffectPerOption {
    "Spots in narrow gaps are rejected."
    "Spots in narrow gaps are allowed."
   }
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_ChokepointWidthAttribute"
   m_iBeta 1
   m_sWhat "An indoor spot counts as a narrow gap when walls on two opposite sides are closer together than this (m)."
   m_sLow "0.5 m: almost nothing counts as narrow."
   m_sHigh "4 m: normal corridors and small rooms count as narrow and are rejected."
   m_sRecommended "Default (1.4 m)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_RejectChokepointsAttribute"
   m_sEffect "Gaps narrower than %1 m count as narrow."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_MinBookedDistanceAttribute"
   m_iBeta 1
   m_sWhat "Minimum distance (m) from spots other soldiers have already booked."
   m_sLow "0 m: soldiers may take spots right next to booked ones."
   m_sHigh "10 m: soldiers spread widely; fewer spots per building."
   m_sRecommended "Default (3 m)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_OccupancyRadiusAttribute DCO_T_FI_WeightSpreadAttribute"
   m_sEffect "Spots within %1 m of a booked spot are rejected."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_RequireFireLineAttribute"
   m_iBeta 1
   m_sWhat "Indoor spots need at least one firing direction: a line out of a window or door, or a long (8 m+) line inside the building."
   m_sLow "Off: enclosed spots are allowed; helps in packed buildings."
   m_sHigh "On: enclosed spots are rejected; searches in tight buildings may fail."
   m_sRecommended "On."
   m_iPerf 0
   m_sRelated "DCO_T_FI_InteriorLineValueAttribute DCO_T_FI_WeightFireLineAttribute"
   m_aEffectPerOption {
    "Spots need a firing line."
    "Spots without a firing line are allowed."
   }
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_WeightCoverAttribute"
   m_iBeta 1
   m_sWhat "Score weight for how enclosed an indoor spot is (walls within 2.5 m in 8 directions), relative to the other three weights."
   m_sLow "0: protection is ignored."
   m_sHigh "1: protection dominates the choice."
   m_sRecommended "Default (0.35)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_WeightFireLineAttribute DCO_T_FI_WeightSpreadAttribute DCO_T_FI_WeightProximityAttribute"
   m_sEffect "Cover weight is %1."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_WeightFireLineAttribute"
   m_iBeta 1
   m_sWhat "Score weight for firing directions from an indoor spot (up to 3 counted), relative to the other three weights."
   m_sLow "0: firing lines are ignored when scoring."
   m_sHigh "1: spots with the most firing lines win."
   m_sRecommended "Default (0.35)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_WeightCoverAttribute DCO_T_FI_WeightSpreadAttribute DCO_T_FI_WeightProximityAttribute DCO_T_FI_InteriorLineValueAttribute"
   m_sEffect "Firing line weight is %1."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_WeightSpreadAttribute"
   m_iBeta 1
   m_sWhat "Score weight for distance from spots other soldiers booked (full at 8 m+), relative to the other three weights."
   m_sLow "0: soldiers may bunch up in one corner."
   m_sHigh "1: soldiers spread out as far as possible."
   m_sRecommended "Default (0.15)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_WeightCoverAttribute DCO_T_FI_WeightFireLineAttribute DCO_T_FI_WeightProximityAttribute"
   m_sEffect "Spread weight is %1."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_WeightProximityAttribute"
   m_iBeta 1
   m_sWhat "Score weight for being close to the point the behaviour asked for, relative to the other three weights."
   m_sLow "0: distance from the requested point is ignored."
   m_sHigh "1: the spot nearest the requested point wins."
   m_sRecommended "Default (0.15)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_WeightCoverAttribute DCO_T_FI_WeightFireLineAttribute DCO_T_FI_WeightSpreadAttribute"
   m_sEffect "Proximity weight is %1."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_InteriorLineValueAttribute"
   m_iBeta 1
   m_sWhat "How much a firing line that stays inside the building (8 m+ clear) counts, compared with one out of a window or door (1)."
