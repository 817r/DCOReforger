   m_sHigh "1: long corridors count as much as windows."
   m_sRecommended "Default (0.5)."
   m_iPerf 0
   m_sRelated "DCO_T_FI_WeightFireLineAttribute DCO_T_FI_RequireFireLineAttribute"
   m_sEffect "An interior firing line counts %1 of an outside one."
  }
  DCO_SettingHelp {
   m_sAttribute "DCO_T_FI_StickinessBonusAttribute"
   m_iBeta 1
   m_sWhat "Score bonus for the spot the soldier already holds, so he does not move for a slightly better one when searching again."
