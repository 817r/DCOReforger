  DCO_T_FM_EchelonAttribute "{5DC0F3A1B2C4034C}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{5DC0F3A1B2C4034D}" {
    Name "Auto Formation: Flank Echelon"
    Description "When a known enemy is 30-120 degrees off the direction of travel, squads in wedge or line switch to an echelon toward that side."
   }
   m_CategoryConfig "{71B060A85612D8F2}Configs/Editor/AttributeCategories/Squad.conf"
