  }
  DCO_T_IS_EstShareAttribute "{5DC0F3A1B2C40400}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{5DC0F3A1B2C40401}" {
    Name "Share Unseen Shooter Estimates"
    Description "Squads pass their estimate of an unseen shooter (from incoming fire) to friendly squads in voice or radio range, with delay and extra error per hop. Machine gunners and grenadiers of the other squad can then suppress a shooter they never saw. Uses the contact sharing ranges, radio rule and hop count."
   }
   m_CategoryConfig "{8F4E976595BE284D}Configs/Editor/AttributeCategories/GlobalContactSharing.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_IS_DesignateAttribute "{5DC0F3A1B2C40402}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{5DC0F3A1B2C40403}" {
    Name "Target Designation In Squad"
    Description "Marksmen and squad leaders point out what they see to the right specialist in their own squad: armor to the AT gunner, an enemy MG or a soldier in a building to the grenadier and MG, a group of infantry to the MG."
   }
   m_CategoryConfig "{8F4E976595BE284D}Configs/Editor/AttributeCategories/GlobalContactSharing.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_IS_QualityAttribute "{5DC0F3A1B2C40404}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{5DC0F3A1B2C40405}" {
    Name "Information Quality"
    Description "Every estimate carries its source (heard, seen by a teammate, reported), hop count and age. Older and second-hand information gets a wider search radius and lower confidence; grenadiers only fire 40 mm when confidence is at least 0.4."
   }
   m_CategoryConfig "{8F4E976595BE284D}Configs/Editor/AttributeCategories/GlobalContactSharing.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_HEAR_V2Attribute "{5DC0F3A1B2C40500}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{5DC0F3A1B2C40501}" {
    Name "Hearing: Per Soldier"
    Description "Every soldier listens from his own position instead of only the squad leader. Footstep loudness depends on speed (walk 12 m, run 30 m, sprint 40 m), stance (crouch half, prone 30%) and ground (towns louder, woods quieter). Reloading is heard at 8 m, doors at 20 m. The soldier who hears it looks first, then the squad."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_HEAR_MaskAttribute "{5DC0F3A1B2C40502}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{5DC0F3A1B2C40503}" {
    Name "Hearing: Battle Noise Masking"
    Description "Nearby gunfire (last 3 s: 40%, last 10 s: 70%) and running engines close by (50%) shorten how far soldiers hear. Rain and strong wind still apply."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_HEAR_ContactAttribute "{5DC0F3A1B2C40504}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{5DC0F3A1B2C40505}" {
    Name "Hearing: Listen During Contact"
    Description "Squads keep listening for footsteps, engines and doors while in a firefight, so an enemy flanking around them can be heard. Only sources the squad does not already see count."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_HEAR_EstAttribute "{5DC0F3A1B2C40506}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{5DC0F3A1B2C40507}" {
    Name "Hearing: Heard Estimates"
    Description "What a squad hears becomes an estimate with a radius and confidence (logged heard_est). With Share Unseen Shooter Estimates on it is passed to nearby squads, and machine gunners use it to pick a fire position before contact."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_HEAR_ShotErrAttribute "{3B7E52C9A1D84F11}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{3B7E52C9A1D84F12}" {
    Name "Gunfire Position Error"
    Description "How far off soldiers are when they locate a shooter they only heard. 1 = realistic: the direction is off by 5-15 degrees and the distance by 15-50 % (more for faint, distant shots), and the error shrinks each time the same spot fires again, down to 30 %. Moving after firing starts a new estimate. 0 = soldiers know the exact spot from sound alone. The position is exact anyway when the shooter is seen, closer than 50 m, or at night when the muzzle flash is in view (not with a suppressor)."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues "{3B7E52C9A1D84F13}" {
    m_fMin 0
    m_fMax 3
    m_fStep 0.1
   }
  }
  DCO_T_RT_FastAttribute "{5DC0F3A1B2C40600}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{5DC0F3A1B2C40601}" {
    Name "Fast Close-Range Reaction"
    Description "Close fights feel quicker. Under 30 m the first-shot delay is 0.2 s when under heavy fire (vanilla 0.8 s) and 0.15 s when surprised; a target that reappears within 10 s is engaged without delay. Aim settles in 0.35 s under 25 m (was 0.8 s), suppression and morale knock the aim back half as much up close, and small moves (under 3 m, under 30 degrees) no longer reset the aim. Longer ranges are unchanged."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_AGG_ProfileAttribute "{2BA98C1F89E8E100}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{2BA98C1F89E8E101}" {
    Name "Aggressive: Scale Soldiers With AI Aggression"
    Description "Makes the AI Aggression slider change how soldiers fight, relative to today. At slider 1 nothing changes. Higher: shorter waits in cover (wait x slider^-0.7, at 2.5 about 50% shorter), shorter waits in the open, they close in nearer (min distance x slider^-0.5, at 2.5: 19/32/51 m for aggressive/balanced/defensive postures), tolerate more suppression before stress level 1 (x slider^0.3, max 0.9), and squads count as superior at a lower force ratio (2.0 / slider^0.5, floor 1.2). The engaged forward-bound chance also scales with slider^0.7 (before this, a higher slider gave FEWER bounds). Lower than 1 does the opposite. Default On. Pinned, grenade, friendly-lane and panic rules never change."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_AGG_BoundV2Attribute "{B9DE1CF6468F6100}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{B9DE1CF6468F6101}" {
    Name "Aggressive: Forward Bounds Rise With Aggression"
    Description "During a firefight each soldier rolls every few seconds whether to bound to the next cover. Old rule: the roll used the take-cover chance, which the AI Aggression slider divides, so higher aggression meant FEWER bounds. New rule: chance = base take-cover chance x personality (Cautious 0.6, Measured 1.0, Aggressive 1.3, Reckless 1.5) x (0.6 + 0.4 x slider, max 2.0), x1.35 in the open, max 0.95. Bounds still end in cover."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_AGG_RetfireAttribute "{EB7C3EFCEE4B5100}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{EB7C3EFCEE4B5101}" {
    Name "Aggressive: Return Fire At Unseen Shooters"
    Description "When a soldier is fired on by a shooter he cannot see (15-400 m, cooldown 12 s), he fires back at the suspected position with chance 0.3 x (AI Aggression slider), max 0.7, instead of the tuned default (0). Never when pinned, in a vehicle or on Hold Fire."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_TM_OpenRuleV2Attribute "{DCEFBF18E3EB9162}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{AEE53CB5957D4F08}" {
    Name "Open Ground: Get Off The Open"
    Description "A soldier caught standing still in the open while vigilant or under fire rushes to the nearest cover or, with no cover near, goes prone and crawls. Also applies when shaken. Off = only alerted, calm soldiers use the open-ground rule."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_CM_DirDecodeAttribute "{B95109F9AEEA08E3}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{9D11DA9A60D6BAA3}" {
    Name "Combat Move: Decode Move Direction"
    Description "Combat moves that are given as a direction (forward, left, right, back from the enemy) are turned into the real direction relative to the enemy before the soldier moves. Off = the engine uses the raw request position, which can send soldiers sideways or toward the enemy when they meant to fall back."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_TM_AtkCloseInAttribute "{CFF3D5965D88CF60}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{081B74AFB033DB48}" {
    Name "Attackers: Close In To Assault Range"
    Description "Squads on an attack task (ATTACK/FLANK, or Search and Destroy without a commander) keep advancing to assault range instead of stopping at the normal stop distance (30/50/80 m by posture). The stop distance is multiplied by attacker_stop_dist_mul (0.4 = 12/20/32 m). Soldiers under heavy fire still stop. Off = attackers stop at the normal distance."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_BC_ShakenAttribute "{31AD10EC60C2C82B}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{AD666724345F9ACC}" {
    Name "Squads Break Contact When Shaken"
    Description "A squad in contact breaks contact (fire and movement back to a rally point) when most of its soldiers are shaken or worse, and stays combat ineffective for 150 s. Off = squads only break contact when overrun or depleted."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_BC_LadderSliderAttribute "{4779867C91DAAD20}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{406B6B51CD4D47D3}" {
    Name "Casualty Ladder Uses Aggression Slider"
    Description "The squad posture ladder (go defensive or evasive after casualties) uses the AI Aggression slider as shown in GM (1.0 = default: defensive at 50% losses, evasive at 70%). Off = it uses the internal aggression value, which makes squads stay aggressive until about 90-95% losses."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_OPP_ExposedAttribute "{ADA50ABBA0CE5100}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{ADA50ABBA0CE5101}" {
    Name "Opportunist: Exposed Targets"
    Description "Riflemen prefer enemies caught in the open: open ground +3, moving faster than 1.5 m/s +2, standing +1 (max +5) on top of the normal target score. An enemy shooting at them still comes first. Aim settles 30% faster on an exposed or running target."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_OPP_DistractedAttribute "{924E853887EB8100}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{924E853887EB8101}" {
    Name "Opportunist: Distracted Enemy"
    Description "An enemy 40-150 m away who has not shot at this soldier for 5 s and faces more than 60 degrees away is a chance: if visible he gets +2 target score, if not the soldier moves 15-30 m to cover 30-60 degrees off the line, on the side behind the enemy shoulder. At most 1 in 4 of the squad moves at once; cooldown 20 s divided by the AI Aggression slider."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_OPP_PushAttribute "{D47F0A66C1950100}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{D47F0A66C1950101}" {
    Name "Opportunist: Push On Quiet Enemy"
    Description "When a squad mate is firing at the same enemy and that enemy has not fired for 6 s (divided by the AI Aggression slider), the soldier bounds 10-25 m forward to cover, stopping 20 m short. At most half the squad moves at once (more with higher aggression); cooldown 15 s divided by aggression. Never on Defend/Garrison, indoors, during CQB or support-by-fire."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_AGG_UsageMapAttribute "{4F69E88D77C48700}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{4F69E88D77C48701}" {
    Name "Aggressive: Responsive Grenade Usage"
    Description "Off: frag and grenade launcher usage = min(setting x AI Aggression slider x 2.5, 1), so at the default slider every usage of 0.4 or more is the same maximum. On: usage = 1 - (1 - setting)^(slider x 2.5), so lower settings still mean fewer grenades. Applies to newly spawned soldiers."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_THR_FlankFriendAttribute "{CAB10A1290C7CA00}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{CAB10A1290C7CA01}" {
    Name "Threat Flank: From Friendly Contact Line"
    Description "Counter-flank point is set about 90 degrees off the line between the friendly group in contact and the enemy, on the side nearer the flanking group (higher ground breaks ties). Off: the point is turned 55-80 degrees from the flanking group's own approach, which can put it on the same side as the friendly group."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_THR_LowClusterAttribute "{6B2E91D4A7C35F00}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{6B2E91D4A7C35F01}" {
    Name "Threat: Big Groups Are Never Low Priority"
    Description "A threat built only from small, harmless reports (2 or fewer enemies each) is normally ignored by the commander. On: once the whole cluster has 3 or more enemies, or its score is 1.5 times the response gate, the commander responds to it."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_DEF_ShortfallAttribute "{59A2E75B02BB631F}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{7402F03BA36B0AC9}" {
    Name "Defense: Request Spawner Groups When Short"
    Description "When an owned objective has fewer defend/garrison groups than it needs (or none), the commander first moves a spare defender from a quiet objective, otherwise asks a spawner for groups within its budget; arriving groups garrison the objective."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_DEF_GarrisonFloorAttribute "{87F6D156B092B0FD}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{EEE38FB36D0618CE}" {
    Name "Defense: Minimum Garrison Per Objective"
    Description "Each owned objective keeps a minimum number of defending groups: 1 (radius up to 50 m), 2 (up to 100 m), 3 (larger or primary), more when many enemies are near. Threat responses may not pull a defender below it, and shortfall requests ask for at least this many."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_GRP_BcNotFreeAttribute "{E82F508A24D30A32}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{FF9B6C8C018F206A}" {
    Name "Break Contact: Squad Not Free For New Tasks"
    Description "While a squad is breaking contact (withdrawing from a fight), the commander does not count it as a free reserve, so threat responses and other pickers cannot hand it a new task until it has finished. Off: a squad that stops for a moment during its withdrawal can be sent straight back toward the enemy."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_LOGI_LowRelAttribute "{3F8AD05C19E47B00}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{3F8AD05C19E47B01}" {
    Name "Low Ammo: Compare To Own Loadout"
    Description "A soldier counts as low on ammo only when he has fewer spare magazines than the minimum AND fewer than he started with. Off: the minimum alone decides, so MG gunners and AT/GL soldiers that start with 1-2 spares report low ammo before firing a shot."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_LOGI_ExtractIneffAttribute "{58C1E7A2D49B3E00}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{58C1E7A2D49B3E01}" {
    Name "Extraction: Only Combat-Ineffective Squads"
    Description "On: the commander sends a squad back to the logistics hub for extraction only when it is combat ineffective. A healthy squad that is only withdrawing (break contact, delay, OP withdraw) keeps its own fallback point and stays near its objective. Off: any withdrawing squad is also marched to the hub."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_LOGI_CrossSrcAttribute "{7A3C55E81B2F9D00}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{7A3C55E81B2F9D01}" {
    Name "Crosslevel: Needs Ammo Source At Hub"
    Description "On: a low-ammo squad near its logistics hub (under 200 m) is told to crosslevel there only when a real ammo source (arsenal or resupply station, e.g. an ammo truck) is within 200 m; otherwise a normal RESUPPLY job is queued. Off: any squad near the hub is told to crosslevel, even when the hub has nothing to hand out."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_THR_FlankRouteAttribute "{9DECA426AD94DB00}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{9DECA426AD94DB01}" {
    Name "Threat Flank: Route Around Enemy Front"
    Description "When the straight run to the flank point would pass closer than 80% of the flank distance to the enemy, the group first goes to a detour point at the full flank distance, so it does not run across the enemy front."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_THR_FlankRetargetAttribute "{8CD7E9BB0E9FBC00}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{8CD7E9BB0E9FBC01}" {
    Name "Threat Flank: Update Assault Point"
    Description "Every threat think cycle (45 s) the final assault point of a counter-flanking group moves to the latest believed enemy position when the enemy has moved 30 m or more (Threat Flank Retarget Distance in the server config)."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_CQB_LostWindowAttribute "{F9956E9757F0C200}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{F9956E9757F0C201}" {
    Name "Clear Building After Lost Contact"
    Description "Seconds after contact is lost during which an enemy whose last known position is inside a building still starts the building clear. 0 = only enemies seen in the last 10 s (old behaviour). Example: 45 = the squad clears the house the enemy ran into instead of idling until it is seen again."
   }
   m_CategoryConfig "{ED6A4F88A45A3EFF}Configs/Editor/AttributeCategories/GlobalCQB.conf"
   m_Layout "{680E4985E42137FB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Slider.layout"
   m_baseValues SCR_EditorAttributeBaseValues "{F9956E9757F0C202}" {
    m_sSliderValueFormating "%1 s"
    m_fMax 120
    m_fStep 5
    m_iDecimals 0
   }
  }
  DCO_T_CQB_PrecheckAttribute "{E8590E9B4C350D4B}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{44F6FB9C06333E31}" {
    Name "Skip Unclearable Buildings"
    Description "Before a squad starts clearing a building, check its indoor navigation graph. Buildings that cannot be planned (no outside door, empty or no rooms) are skipped and the squad picks another building. Off = the squad tries, aborts and retries that building later (cqb_plan_fail_retry_s in the server config)."
   }
   m_CategoryConfig "{ED6A4F88A45A3EFF}Configs/Editor/AttributeCategories/GlobalCQB.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_CTRL_GunExceptionsAttribute "{33C4BD9D31478400}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{33C4BD9D31478401}" {
    Name "Static Gunner: Leave Lost Gun"
    Description "A soldier on a static weapon (HMG, AGL) also gets off when the weapon is destroyed, when it has been empty for 8 s, or when he is under threat from an enemy within 150 m that is 15 degrees or more outside the gun traverse arc. Off: he only gets off when an enemy is within 15 m."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_CMD_RoleOnAttribute "{3B7E21C94A6D5F90}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{3B7E21C94A6D5F91}" {
    Name "Attack Only / Defend Only Roles"
    Description "Use the Attack Only and Defend Only commander lists of objectives: attack-only commanders capture and then hand the objective over to a commander allowed to defend it; defend-only commanders never attack an objective the enemy holds. Off = the lists are ignored."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_CMD_EstBlendAttribute "{3B7E21C94A6D5F80}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{3B7E21C94A6D5F81}" {
    Name "Careful Enemy Estimates"
    Description "Commanders update their enemy estimate for an objective carefully: a small contact lowers a large estimate only gradually, old memory without eyes on target cannot raise it, and unconfirmed estimates fade with a 10 minute half-life but never below half of the mission briefing."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_CMD_AggProfileAttribute "{3B7E21C94A6D5F70}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{3B7E21C94A6D5F71}" {
    Name "Commander Aggression Profile"
    Description "Lets the AI Aggression slider shape commander timing: push, pursuit and consolidation waits and posture holds scale with the slider tempo, and offensive commanders set fewer ambushes. Also active whenever the K2 aggression scale is on."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_CMD_FixLosAttribute "{3B7E21C94A6D5F60}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{3B7E21C94A6D5F61}" {
    Name "Fire Support Needs Line Of Sight"
    Description "When the support-by-fire position of a siege or attack-by-fire has no line of sight to the objective, the commander searches up to 27 positions on a ring around the objective for one that does; if none is found the old position is kept."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_CMD_ReleaseExecAttribute "{3B7E21C94A6D5F50}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{3B7E21C94A6D5F51}" {
    Name "Assault Executes On Release"
    Description "When the commander releases an assault, the assaulting groups switch straight to the execute posture (move in and close with the enemy) instead of keeping their staging posture until each group re-evaluates."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_CMD_DefPrioAttribute "{3B7E21C94A6D5F40}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{3B7E21C94A6D5F41}" {
    Name "Defend Most Important First"
    Description "A defending commander staffs its objectives in order of importance (objective value, threat nearby, contested) instead of list order, so the key objective gets its defenders first when groups are short."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_CMD_GarLeftoverAttribute "{3B7E21C94A6D5FA0}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{3B7E21C94A6D5FA1}" {
    Name "Garrison Leftovers Take Field Positions"
    Description "Soldiers of a garrison group who do not fit in the building slots get fighting positions in the field next to the building (scored for line of sight and cover) instead of standing around outside."
   }
   m_CategoryConfig "{F2FC8F6073926832}Configs/Editor/AttributeCategories/GlobalSquadDrills.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_CMD_GarArriveAttribute "{3B7E21C94A6D5F30}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{3B7E21C94A6D5F31}" {
    Name "Garrison Starts On Arrival"
    Description "A garrison group starts taking its building positions as soon as part of it reaches the objective (instead of waiting for the whole group or a long timer), so defenders are inside before the attack arrives."
   }
   m_CategoryConfig "{F2FC8F6073926832}Configs/Editor/AttributeCategories/GlobalSquadDrills.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_CMD_K2Attribute "{3B7E21C94A6D5F20}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{3B7E21C94A6D5F21}" {
    Name "Commander Aggression Scale"
    Description "How commanders read the AI Aggression slider. On: the slider is an odds multiplier (2 = twice the odds to attack or exploit, 0.5 = half) with a gradual tempo (up to 2x faster) and safety floors (staging 30 s, recon 90 s, attack ratio 1.3:1); attacks never start before staged groups arrive. Off: the older linear scale, where most commanders already hit the maximum at slider 1."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_CMD_PhaseOnAttribute "{3B7E21C94A6D5F10}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{3B7E21C94A6D5F11}" {
    Name "Objective Phases"
    Description "Use the Phase / Active After settings of objectives: a side attacks phase N only after it holds every objective of the earlier phases (then waits Active Delay). Off = every objective can be attacked at any time. Only matters when a mission sets phases on its objectives."
   }
   m_CategoryConfig "{10DD7E604EB5A8FE}Configs/Editor/AttributeCategories/GlobalCommander.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_AGG_PursueAttribute "{0D9348D6F9E70D00}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{0D9348D6F9E70D01}" {
    Name "Aggressive: Pursue Retreating Enemy"
    Description "When a seen enemy soldier 40-200 m away pulls back at least 5 m in about 3 s and has not fired for 3 s, the two nearest riflemen of the squad (not MG/AR) bound 10-30 m after him to cover, never ending closer than 40 m and never more than 150 m from their leader. The rest of the squad keeps firing. At most 3 pursuits per enemy; squad cooldown 30 s divided by the AI Aggression slider. Never on Defend/Garrison, indoors, during CQB, support-by-fire, hold fire, pinned or panicking."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_AGG_PostFragAttribute "{00E59CA603A36400}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{00E59CA603A36401}" {
    Name "Aggressive: Rush After Grenade"
    Description "When a soldier throws a frag at an enemy 10-35 m away and it bursts within 6 m of that enemy, the nearest squad mate within 15 m (not MG/AR) sprints crouched along the throw line to 8-12 m short of the enemy, never closer than 8 m to the burst. One rusher per throw; squad cooldown 20 s divided by the AI Aggression slider. Never on Defend/Garrison, indoors, during CQB, support-by-fire, hold fire, pinned or panicking."
   }
   m_CategoryConfig "{4BBA5D6FF7C0CA48}Configs/Editor/AttributeCategories/GlobalCombat.conf"
   m_Layout "{D0F3CE0C63A5AEBB}UI/layouts/Editor/Attributes/AttributePrefabs/AttributePrefab_Checkbox.layout"
  }
  DCO_T_OPP_ClusterAttribute "{3673977B94603100}" {
   m_UIInfo SCR_EditorAttributeUIInfo "{3673977B94603101}" {
    Name "Opportunist: Grenade Bunched Enemies"
